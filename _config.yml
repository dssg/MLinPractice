title: "10-718: Machine Learning in Practice"
description: "A project-based course on responsible designing, building, and evaluating ML systems — CMU 10-718."

# --- Theme (remote theme; nothing vendored into this repo) ---
remote_theme: just-the-docs/just-the-docs
url: "https://dssg.github.io"
baseurl: "/MLinPractice"

# --- just-the-docs options ---
color_scheme: light
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true

aux_links:
  "View on GitHub":
    - "https://github.com/dssg/MLinPractice"
aux_links_new_tab: true

last_edit_timestamp: true
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/dssg/MLinPractice"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

callouts:
  due:
    title: Due
    color: red
  note:
    title: Note
    color: blue

# --- Navigation control ---------------------------------------------------
# Hide EVERY page from the sidebar by default, then opt pages back in with
# `nav_exclude: false` in their front matter. This makes the nav an explicit
# list you control — stray files in the repo can never appear again.
defaults:
  - scope:
      path: ""
    values:
      nav_exclude: true
# --------------------------------------------------------------------------

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
